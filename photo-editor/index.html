<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이트박스 사진 편집기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one-screen workbench. A lit stage on the left, a narrow instrument column on the right; stacks on phones. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --soft:#F4F5F7; --ink:#16181D; --muted:#5C6371; --line:#D8DCE3;
  --stage:#E1E4E9; --check-a:#F8F9FA; --check-b:#E2E5EA;
  --accent:#D4520E; --accent-ink:#FFFFFF; --accent-soft:#FBE6DA; --danger:#B42318;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#171A1F; --soft:#1E2228; --ink:#E7E9ED; --muted:#99A0AD; --line:#2A2F37;
    --stage:#0A0B0E; --check-a:#1C1F24; --check-b:#25292F;
    --accent:#FF7A33; --accent-ink:#1A0C03; --accent-soft:#3A2214; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#171A1F; --soft:#1E2228; --ink:#E7E9ED; --muted:#99A0AD; --line:#2A2F37;
  --stage:#0A0B0E; --check-a:#1C1F24; --check-b:#25292F;
  --accent:#FF7A33; --accent-ink:#1A0C03; --accent-soft:#3A2214; --danger:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* header */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:22px;height:18px;border:2px solid var(--ink);border-radius:3px;position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:3px;background:var(--accent);border-radius:1px}
.brand b{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.group{display:flex;gap:6px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);
  background:var(--surface);border-radius:7px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.icon{width:34px;padding:0}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.wide{width:100%}

/* workbench */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
.stage{position:relative;background:var(--stage);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.viewport{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden}
#view{display:block;max-width:100%;
  background-color:var(--check-a);
  background-image:conic-gradient(var(--check-b) 25%,transparent 0 50%,var(--check-b) 0 75%,transparent 0);
  background-size:16px 16px;box-shadow:0 0 0 1px var(--line)}
.stage-info{display:flex;flex-wrap:wrap;gap:4px 16px;padding:8px 14px;border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface)}
.stage-info .tag{color:var(--accent);font-family:var(--font-body);font-weight:500}

/* crop overlay */
.cropwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;cursor:crosshair;flex:none}
#cropCanvas{display:block;width:100%;height:100%}
.cropbox{position:absolute;border:1px solid #fff;box-shadow:0 0 0 9999px rgba(8,9,12,.58);cursor:move}
.cropbox .g{position:absolute;background:rgba(255,255,255,.45);pointer-events:none}
.cropbox .gv{top:0;bottom:0;width:1px}.cropbox .gh{left:0;right:0;height:1px}
.cropbox .size{position:absolute;left:0;top:-26px;background:rgba(8,9,12,.75);color:#fff;font:12px/1 var(--font-mono);
  padding:5px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.cropbox .size.inside{top:6px;left:6px}
.h{position:absolute;width:12px;height:12px;background:#fff;border:1px solid rgba(8,9,12,.6);border-radius:2px;margin:-6px 0 0 -6px}
.h::before{content:"";position:absolute;inset:-10px}
.h[data-h="nw"]{left:0;top:0;cursor:nwse-resize}.h[data-h="n"]{left:50%;top:0;cursor:ns-resize}
.h[data-h="ne"]{left:100%;top:0;cursor:nesw-resize}.h[data-h="e"]{left:100%;top:50%;cursor:ew-resize}
.h[data-h="se"]{left:100%;top:100%;cursor:nwse-resize}.h[data-h="s"]{left:50%;top:100%;cursor:ns-resize}
.h[data-h="sw"]{left:0;top:100%;cursor:nesw-resize}.h[data-h="w"]{left:0;top:50%;cursor:ew-resize}

.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--stage) 80%,transparent);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:var(--ink);pointer-events:none}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-y:auto;min-height:0;min-width:0}
.sec{padding:14px 16px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-size:13.5px;font-weight:600}
.sum{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.sum.on{color:var(--accent)}
.hint{margin:0;font-size:12px;color:var(--muted)}

.field{display:grid;grid-template-columns:58px minmax(0,1fr) 68px;align-items:center;gap:10px}
.field>label{font-size:12.5px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.num{width:100%;height:30px;font-family:var(--font-mono);font-size:12.5px;padding:0 6px;border:1px solid var(--line);border-radius:6px;
  background:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.num:focus{border-color:var(--accent);outline:none}
.colorrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
input[type=color]{inline-size:34px;block-size:28px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--soft);cursor:pointer}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;
  font-size:12.5px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chip.ko{font-family:var(--font-body)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:end}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>.btn{flex:1}

.lockbtn{height:30px;width:30px;border:1px solid var(--line);border-radius:6px;background:var(--soft);cursor:pointer;display:grid;place-items:center}
.lockbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.lockbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.switch{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset:disabled{opacity:.45}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg label{display:flex;align-items:center;justify-content:center;height:32px;cursor:pointer;font-family:var(--font-mono);font-size:12.5px;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent);font-weight:500}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .stage{height:56vh;min-height:300px}
  .viewport{padding:16px}
  .panel{overflow:visible}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand"><div class="mark" aria-hidden="true"></div><b>Lightbox</b><span>사진 편집기</span></div>
    <div class="group">
      <label class="btn" for="file">사진 열기</label>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="btn icon" id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn icon" id="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn" id="resetAll" title="모든 편집을 지우고 원본으로">원본으로</button>
      <button class="btn primary" id="saveTop">저장</button>
    </div>
  </header>

  <main class="work">
    <section class="stage" aria-label="미리보기">
      <div class="viewport" id="viewport">
        <canvas id="view"></canvas>
        <div class="cropwrap" id="cropwrap" hidden>
          <canvas id="cropCanvas"></canvas>
          <div class="cropbox" id="cropbox">
            <div class="g gv" style="left:33.333%"></div><div class="g gv" style="left:66.666%"></div>
            <div class="g gh" style="top:33.333%"></div><div class="g gh" style="top:66.666%"></div>
            <div class="size" id="cropSize"></div>
            <div class="h" data-h="nw"></div><div class="h" data-h="n"></div><div class="h" data-h="ne"></div><div class="h" data-h="e"></div>
            <div class="h" data-h="se"></div><div class="h" data-h="s"></div><div class="h" data-h="sw"></div><div class="h" data-h="w"></div>
          </div>
        </div>
        <div class="drop" id="drop" hidden>여기에 놓으면 사진을 엽니다</div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <footer class="stage-info" id="info"></footer>
    </section>

    <aside class="panel" aria-label="편집 도구">
      <!-- crop -->
      <section class="sec">
        <div class="sec-h"><h2>자르기</h2><span class="sum" id="sumCrop"></span></div>
        <div class="chips" id="ratios">
          <button class="chip ko" data-ratio="free">자유</button>
          <button class="chip ko" data-ratio="orig">원본</button>
          <button class="chip" data-ratio="1">1:1</button>
          <button class="chip" data-ratio="1.3333">4:3</button>
          <button class="chip" data-ratio="1.5">3:2</button>
          <button class="chip" data-ratio="1.7778">16:9</button>
          <button class="chip" data-ratio="0.75">3:4</button>
          <button class="chip" data-ratio="0.5625">9:16</button>
        </div>
        <div class="grid4">
          <label class="lbl">X<input class="num" id="cx" type="number" min="0" step="1"></label>
          <label class="lbl">Y<input class="num" id="cy" type="number" min="0" step="1"></label>
          <label class="lbl">너비<input class="num" id="cw" type="number" min="1" step="1"></label>
          <label class="lbl">높이<input class="num" id="ch" type="number" min="1" step="1"></label>
        </div>
        <div class="row" id="cropIdle"><button class="btn sm" id="cropStart">영역 선택</button></div>
        <div class="row" id="cropBusy" hidden>
          <button class="btn sm primary" id="cropApply">적용</button>
          <button class="btn sm" id="cropAll">전체</button>
          <button class="btn sm" id="cropCancel">취소</button>
        </div>
        <p class="hint" id="cropHint">비율을 고르거나 ‘영역 선택’을 누른 뒤 사진 위를 드래그하세요.</p>
      </section>

      <!-- resize -->
      <section class="sec">
        <div class="sec-h"><h2>크기</h2><span class="sum" id="sumSize"></span></div>
        <div class="grid2">
          <label class="lbl">너비 (px)<input class="num" id="ow" type="number" min="1" max="12000" step="1"></label>
          <button class="lockbtn" id="lock" aria-pressed="true" title="비율 고정" aria-label="비율 고정"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></button>
          <label class="lbl">높이 (px)<input class="num" id="oh" type="number" min="1" max="12000" step="1"></label>
        </div>
        <div class="chips">
          <button class="chip" data-pct="0.25">25%</button>
          <button class="chip" data-pct="0.5">50%</button>
          <button class="chip" data-pct="0.75">75%</button>
          <button class="chip" data-pct="1">100%</button>
          <button class="chip" data-long="1080">긴 변 1080</button>
          <button class="chip" data-long="1920">긴 변 1920</button>
        </div>
      </section>

      <!-- border -->
      <section class="sec">
        <div class="sec-h"><h2>테두리</h2><span class="sum" id="sumBorder"></span></div>
        <div class="field"><label for="bw">두께</label><input type="range" id="bw" min="0" max="200" step="1" data-bind="border.width"><input class="num" type="number" min="0" step="1" data-bind="border.width" aria-label="테두리 두께 (px)"></div>
        <div class="field"><label for="br">둥글기</label><input type="range" id="br" min="0" max="500" step="1" data-bind="border.radius"><input class="num" type="number" min="0" step="1" data-bind="border.radius" aria-label="모서리 둥글기 (px)"></div>
        <div class="field"><label for="bc">색상</label>
          <div class="colorrow">
            <input type="color" id="bc" data-bind="border.color" aria-label="테두리 색상">
            <button class="sw" style="background:#ffffff" data-sw="#ffffff" aria-label="흰색"></button>
            <button class="sw" style="background:#111111" data-sw="#111111" aria-label="검정"></button>
            <button class="sw" style="background:#8a8f98" data-sw="#8a8f98" aria-label="회색"></button>
            <button class="sw" style="background:#efe6d8" data-sw="#efe6d8" aria-label="미색"></button>
          </div><span></span>
        </div>
        <p class="hint">둥글기는 테두리 없이도 사진 모서리에 적용됩니다.</p>
      </section>

      <!-- opacity -->
      <section class="sec">
        <div class="sec-h"><h2>투명도</h2><span class="sum" id="sumOpacity"></span></div>
        <div class="field"><label for="op">불투명도</label><input type="range" id="op" min="0" max="100" step="1" data-bind="opacity"><input class="num" type="number" min="0" max="100" step="1" data-bind="opacity" aria-label="불투명도 (%)"></div>
      </section>

      <!-- shadow -->
      <section class="sec">
        <div class="sec-h"><h2>그림자</h2>
          <label style="display:flex;align-items:center;gap:8px"><span class="sum" id="sumShadow"></span><input type="checkbox" class="switch" id="shOn" data-bind="shadow.on" aria-label="그림자 켜기"></label>
        </div>
        <fieldset id="shFields" disabled>
          <div class="field"><label for="shx">가로</label><input type="range" id="shx" min="-200" max="200" step="1" data-bind="shadow.x"><input class="num" type="number" step="1" data-bind="shadow.x" aria-label="그림자 가로 위치 (px)"></div>
          <div class="field"><label for="shy">세로</label><input type="range" id="shy" min="-200" max="200" step="1" data-bind="shadow.y"><input class="num" type="number" step="1" data-bind="shadow.y" aria-label="그림자 세로 위치 (px)"></div>
          <div class="field"><label for="shb">흐림</label><input type="range" id="shb" min="0" max="200" step="1" data-bind="shadow.blur"><input class="num" type="number" min="0" step="1" data-bind="shadow.blur" aria-label="그림자 흐림 (px)"></div>
          <div class="field"><label for="sha">진하기</label><input type="range" id="sha" min="0" max="100" step="1" data-bind="shadow.alpha"><input class="num" type="number" min="0" max="100" step="1" data-bind="shadow.alpha" aria-label="그림자 진하기 (%)"></div>
          <div class="field"><label for="shc">색상</label><div class="colorrow"><input type="color" id="shc" data-bind="shadow.color" aria-label="그림자 색상"></div><span></span></div>
        </fieldset>
        <p class="hint">그림자가 잘리지 않도록 결과 이미지에 투명한 여백이 추가됩니다.</p>
      </section>

      <!-- export -->
      <section class="sec">
        <div class="sec-h"><h2>내보내기</h2><span class="sum" id="sumExport"></span></div>
        <div class="seg" role="radiogroup" aria-label="파일 형식">
          <label><input type="radio" name="fmt" value="png" checked><span>PNG</span></label>
          <label><input type="radio" name="fmt" value="jpeg"><span>JPG</span></label>
          <label><input type="radio" name="fmt" value="webp"><span>WebP</span></label>
        </div>
        <div class="field" id="qField" hidden><label for="q">품질</label><input type="range" id="q" min="40" max="100" step="1" value="92"><input class="num" id="qn" type="number" min="40" max="100" step="1" value="92" aria-label="품질"></div>
        <div class="field" id="bgField" hidden><label for="bg">배경</label><div class="colorrow"><input type="color" id="bg" value="#ffffff" aria-label="JPG 배경색"></div><span></span></div>
        <p class="hint" id="fmtHint">PNG는 투명한 부분(투명도, 그림자, 둥근 모서리)을 그대로 보존합니다.</p>
        <button class="btn primary wide" id="save">저장</button>
      </section>
    </aside>
  </main>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

    setImage(im, (f.name || "사진").replace(/\.[^.]+$/, "") || "사진", false);
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast("이 파일은 브라우저가 읽지 못합니다. HEIC라면 JPG로 변환해서 열어 주세요.", true); };
  im.src = url;
}
$("#file").addEventListener("change", e => { loadFile(e.target.files[0]); e.target.value = ""; });

const drop = $("#drop"); let dragDepth = 0;
window.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragDepth++; drop.hidden = false; } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; drop.hidden = true;
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/")) || e.dataTransfer?.files[0];
  loadFile(f);
});
window.addEventListener("paste", e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (it) { const f = it.getAsFile(); if (f) { loadFile(new File([f], "pasted-image." + f.type.split("/")[1], { type: f.type })); } }
});

/* ---------- export ---------- */
$$('input[name="fmt"]').forEach(r => r.addEventListener("change", () => {
  E.fmt = r.value;
  $("#qField").hidden = E.fmt === "png";
  $("#bgField").hidden = E.fmt !== "jpeg";
  $("#fmtHint").textContent = E.fmt === "png" ? "PNG는 투명한 부분(투명도, 그림자, 둥근 모서리)을 그대로 보존합니다."
    : E.fmt === "jpeg" ? "JPG는 투명한 부분을 지원하지 않아 배경색으로 채웁니다. 용량이 가장 작습니다."
    : "WebP는 투명한 부분을 보존하면서 PNG보다 용량이 작습니다.";
}));
$("#q").addEventListener("input", e => { E.quality = +e.target.value; $("#qn").value = E.quality; });
$("#qn").addEventListener("input", e => { const v = parseFloat(e.target.value); if (isFinite(v)) { E.quality = clamp(Math.round(v), 40, 100); $("#q").value = E.quality; } });
$("#bg").addEventListener("input", e => { E.bg = e.target.value; });

let dlP = null;
function getDownloads() {
  if (!dlP) dlP = (window.claude && typeof window.claude.use === "function")
    ? Promise.resolve(window.claude.use("downloads")).catch(() => null) : Promise.resolve(null);
  return dlP;
}
getDownloads();
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB";
let saving = false;
async function save() {
  if (!img || saving) return;
  if (crop.active) applyCrop();
  saving = true; $("#save").disabled = $("#saveTop").disabled = true;
  $("#save").textContent = "만드는 중…";
  try {
    let out = document.createElement("canvas");
    const D = compose(1, out, true);
    if (E.fmt === "jpeg") {
      const j = document.createElement("canvas"); j.width = D.W; j.height = D.H;
      const jc = j.getContext("2d"); jc.fillStyle = E.bg; jc.fillRect(0, 0, D.W, D.H); jc.drawImage(out, 0, 0);
      out = j;
    }
    const mime = "image/" + E.fmt;
    const blob = await new Promise(r => out.toBlob(r, mime, E.quality / 100));
    if (!blob) throw new Error("encode");
    const ext = E.fmt === "jpeg" ? "jpg" : E.fmt;
    if (E.fmt === "webp" && blob.type !== "image/webp") { toast("이 브라우저는 WebP 저장을 지원하지 않습니다. PNG나 JPG를 골라 주세요.", true); return; }
    const filename = `${fileBase}-edited.${ext}`;
    const dl = await getDownloads();
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast(`저장했습니다 · ${D.W}×${D.H} · ${fmtSize(blob.size)}`); }
      catch (err) {
        const code = err && err.code;
        if (code === "declined") toast("저장을 취소했습니다.");
        else if (code === "rate_limited") toast("저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러 주세요.", true);
        else if (code === "host_unavailable") toast("이 앱에서는 파일을 저장할 수 없습니다. 브라우저나 컴퓨터에서 열어 주세요.", true);
        else toast("이 화면에서는 저장할 수 없습니다.", true);
      }
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(`저장했습니다 · ${D.W}×${D.H} · ${fmtSize(blob.size)}`);
    }
  } catch (err) {
    toast("이미지를 만들지 못했습니다. 크기를 줄여서 다시 시도해 보세요.", true);
  } finally {
    saving = false; $("#save").disabled = $("#saveTop").disabled = false; $("#save").textContent = "저장";
  }
}
$("#save").addEventListener("click", save);
$("#saveTop").addEventListener("click", save);

/* ---------- misc ---------- */
let toastT = 0;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), err ? 4200 : 2600);
}
$("#undo").addEventListener("click", undo);
$("#redo").addEventListener("click", redo);
$("#resetAll").addEventListener("click", () => {
  if (!img) return; if (crop.active) exitCrop();
  S = defaults(); syncUI(); scheduleRender(); commit(); toast("원본 상태로 되돌렸습니다. 되돌리기로 취소할 수 있습니다.");
});
window.addEventListener("keydown", e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName) && !["range", "checkbox", "radio", "color"].includes(document.activeElement.type);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === "y" && !typing) { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  else if (crop.active && e.key === "Enter") { e.preventDefault(); applyCrop(); }
  else if (crop.active && e.key === "Escape") { e.preventDefault(); exitCrop(); }
});
new ResizeObserver(() => scheduleRender()).observe(viewport);

/* ---------- example image (generated, so the tool opens in a working state) ---------- */
function makeSample() {
  const W = 1600, H = 1067, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const horizon = 700;
  const sky = g.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, "#22305a"); sky.addColorStop(.45, "#7b5b8c"); sky.addColorStop(.8, "#f09a6b"); sky.addColorStop(1, "#ffd5a3");
  g.fillStyle = sky; g.fillRect(0, 0, W, horizon);
  const sx = 1040, sy = 610;
  const glow = g.createRadialGradient(sx, sy, 10, sx, sy, 420);
  glow.addColorStop(0, "rgba(255,240,200,.9)"); glow.addColorStop(.2, "rgba(255,210,150,.45)"); glow.addColorStop(1, "rgba(255,180,120,0)");
  g.fillStyle = glow; g.fillRect(0, 0, W, horizon);
  g.fillStyle = "#fff4d6"; g.beginPath(); g.arc(sx, sy, 72, 0, Math.PI * 2); g.fill();
  const ridge = (base, amp, col, rough) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, horizon);
    let y = base; const pts = [];
    for (let x = 0; x <= W; x += 20) { y += (rnd() - .5) * rough; y = clamp(y, base - amp, base + amp * .4); pts.push([x, y]); }
    pts.forEach(([x, yy]) => g.lineTo(x, yy)); g.lineTo(W, horizon); g.closePath(); g.fill();
    return pts;
  };
  const r1 = ridge(520, 140, "#8d6a8f", 46);
  const r2 = ridge(590, 120, "#5d4a72", 52);
  const r3 = ridge(650, 80, "#352d4d", 40);
  const water = g.createLinearGradient(0, horizon, 0, H);
  water.addColorStop(0, "#e8a27c"); water.addColorStop(.35, "#6e5677"); water.addColorStop(1, "#1d1c2e");
  g.fillStyle = water; g.fillRect(0, horizon, W, H - horizon);
  g.save(); g.globalAlpha = .35;
  [[r1, "#8d6a8f"], [r2, "#5d4a72"], [r3, "#352d4d"]].forEach(([pts, col]) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, horizon);
    pts.forEach(([x, y]) => g.lineTo(x, horizon + (horizon - y) * .6)); g.lineTo(W, horizon); g.closePath(); g.fill();
  });
  g.restore();
  for (let i = 0; i < 90; i++) {
    const y = horizon + 8 + Math.pow(rnd(), 1.6) * (H - horizon - 10);
    const len = 30 + rnd() * 160 * (1 - Math.abs(rnd() - .5));
    const x = sx + (rnd() - .5) * (120 + (y - horizon) * 1.2);
    g.strokeStyle = `rgba(255,226,180,${.15 + rnd() * .35})`; g.lineWidth = 1 + rnd() * 2;
    g.beginPath(); g.moveTo(x - len / 2, y); g.lineTo(x + len / 2, y); g.stroke();
  }
  return c;
}
setImage(makeSample(), "sample-sunset", true);
})();
